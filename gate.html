<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose Your Door ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="doors-page">

    <div class="particles"></div>

    <div class="doors-container">

        <p class="tiny-title">A LITTLE SURPRISE</p>

        <h1>CHOOSE</h1>

        <p class="door-subtitle">
            Choose the door one by one...
        </p>


        <div class="doors">

            <!-- DOOR 1 -->

            <div class="door-box">

                <div class="door" onclick="openDoor(this)">

                    <div class="door-front">

                        <span class="door-number">01</span>

                        <span class="door-handle">●</span>

                    </div>

                    <div class="door-inside">

                        <img src="image1.jpg" alt="Your image">

                        <h2>Door One</h2>

                        <p>
                            Ye le lo kyonki ❤️
                        </p>

                    </div>

                </div>

            </div>


            <!-- DOOR 2 -->

            <div class="door-box">

                <div class="door" onclick="openDoor(this)">

                    <div class="door-front">

                        <span class="door-number">02</span>

                        <span class="door-handle">●</span>

                    </div>

                    <div class="door-inside">

                        <img src="image2.jpg" alt="Your image">

                        <h2>Door Two</h2>

                        <p>
                             Main busy hu aaj🌸
                        </p>

                    </div>

                </div>

            </div>


            <!-- DOOR 3 -->

            <div class="door-box">

                <div class="door" onclick="openDoor(this)">

                    <div class="door-front">

                        <span class="door-number">03</span>

                        <span class="door-handle">●</span>

                    </div>

                    <div class="door-inside">

                        <img src="image3.jpg" alt="Your image">

                        <h2>Door Three</h2>

                        <p>
                            KAL TEST HAI MERA  💗
                        </p>

                    </div>

                </div>

            </div>

        </div>


        <a href="index.html" class="back">
            ← GO BACK
        </a>

    </div>


    <script src="script.js"></script>

</body>
</html>
